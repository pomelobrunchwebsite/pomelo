<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6ef">
  <title>Mi cuenta | Pomelo Brunch House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500..700;1,500..700&display=swap" rel="stylesheet">
  <style>

:root {
  --cream: #f8f6ef;
  --green: #536247;
  --green-hover: #435039;
  --dark: #25291f;
  --muted: #6b6d61;
  --line: #e5e2d8;
  --white: #fffefa;
  --sand: #e9e4d7;
  --grapefruit: #e88772;
  --grapefruit-hover: #d5745f;
  --grapefruit-soft: #f8e7e1;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--cream);
  color: var(--dark);
  font-family: "Inter", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

a {
  color: inherit;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}

h1, h2, h3, h4 {
  font-family: "Manrope", system-ui, sans-serif;
  margin-top: 0;
}

p {
  margin-top: 0;
}

img {
  display: block;
  max-width: 100%;
}

button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

button, a {
  -webkit-touch-callout: none;
}

:focus-visible {
  outline: 2px solid var(--grapefruit);
  outline-offset: 3px;
}

.hidden {
  display: none !important;
}

/* IMAGEN LATERAL */

.visual {
  min-height: 100vh;
  position: relative;
  background: var(--sand);
  overflow: hidden;
}

.visual img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
}

.visual::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    0deg,
    rgba(37, 41, 31, 0.72),
    rgba(37, 41, 31, 0.05) 65%
  );
}

.visual-copy {
  position: absolute;
  z-index: 1;
  bottom: 10%;
  left: 9%;
  right: 9%;
  color: white;
}

.visual-copy h2 {
  font-family: "Manrope", system-ui, sans-serif;
  font-size: clamp(36px, 4.2vw, 56px);
  font-weight: 800;
  line-height: 1.1;
  margin: 14px 0;
  letter-spacing: -1.2px;
}

.visual-copy h2 em {
  color: var(--grapefruit-soft);
  font-style: italic;
  font-family: "Playfair Display", serif;
  font-weight: 500;
}

.visual-copy p {
  color: rgba(255, 254, 250, 0.85);
  font-size: 15px;
  line-height: 1.7;
  margin-bottom: 0;
}

/* CONTENIDO */

.content {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 48px 8%;
}

.panel {
  width: 100%;
  max-width: 410px;
}

/* LOGOTIPO */

.brand {
  display: inline-block;
  font-family: "Manrope", system-ui, sans-serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.8px;
  line-height: 1.1;
  color: var(--dark);
  transition: transform .2s ease;
}

.brand:hover {
  transform: scale(1.02);
}

.brand span {
  color: var(--grapefruit);
}

.brand small {
  display: block;
  margin-top: 2px;
  font-family: "Inter", system-ui, sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2.8px;
  text-transform: uppercase;
  color: var(--muted);
}

/* ENCABEZADOS */

.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 36px;
  color: var(--grapefruit);
  font-family: "Manrope", system-ui, sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.eyebrow::before {
  content: "";
  width: 24px;
  height: 2px;
  flex-shrink: 0;
  background: var(--grapefruit);
  border-radius: 2px;
}

h1 {
  margin: 16px 0 10px;
  font-family: "Manrope", system-ui, sans-serif;
  font-size: clamp(32px, 3.8vw, 42px);
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -1px;
}

.intro {
  margin: 0 0 28px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.7;
}

/* PESTAÑAS */

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 4px;
  background: var(--line);
  border-radius: 14px;
  margin-bottom: 28px;
}

.tab {
  min-width: 0;
  min-height: 44px;
  padding: 8px 12px;
  background: transparent;
  border: 0;
  border-radius: 10px;
  font-family: "Inter", system-ui, sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.tab:hover {
  color: var(--dark);
}

.tab.active {
  background: var(--white);
  color: var(--dark);
  box-shadow: 0 4px 12px rgba(37, 41, 31, 0.06);
}

/* FORMULARIO */

label {
  display: block;
  margin: 16px 0 7px;
  font-size: 13px;
  font-weight: 700;
}

input {
  display: block;
  width: 100%;
  min-width: 0;
  min-height: 50px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--white);
  padding: 0 16px;
  font-family: "Inter", system-ui, sans-serif;
  font-size: 15px;
  color: var(--dark);
  outline: none;
  transition: all 0.2s ease;
  appearance: none;
  -webkit-appearance: none;
}

input::placeholder {
  color: #a3a397;
}

input:focus {
  border-color: var(--grapefruit);
  box-shadow: 0 0 0 3px var(--grapefruit-soft);
}

/* BOTÓN PRINCIPAL */

.submit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  margin-top: 28px;
  padding: 0 24px;
  border: 0;
  border-radius: 50px;
  background: var(--green);
  color: white;
  font-family: "Inter", system-ui, sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(83, 98, 71, 0.22);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.submit:hover {
  background: var(--green-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(83, 98, 71, 0.3);
}

.submit:active:not(:disabled) {
  transform: scale(0.98);
}

.submit:disabled {
  opacity: 0.6;
  cursor: wait;
}

/* MENSAJES */

.message {
  margin-top: 16px;
  font-size: 13.5px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.message:empty {
  display: none;
}

.message.error {
  color: #a33b32;
}

.message.success {
  color: var(--green);
}

/* ENLACES INFERIORES */

.back {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  margin-top: 16px;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.6;
  color: var(--muted);
  text-decoration: none;
  cursor: pointer;
  transition: color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

a.back:hover,
button.back:hover {
  color: var(--grapefruit);
}

/* TABLET */

@media (max-width: 900px) {
  body {
    grid-template-columns: 0.8fr 1.2fr;
  }

  .content {
    padding: 38px 7%;
  }

  .panel {
    max-width: 400px;
  }

  .visual-copy {
    left: 7%;
    right: 7%;
  }

  .visual-copy h2 {
    font-size: 36px;
  }
}

/* MÓVIL */

@media (max-width: 760px) {
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .visual {
    display: none;
  }

  .content {
    flex: 1;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px calc(40px + env(safe-area-inset-bottom));
  }

  .panel {
    width: 100%;
    max-width: 420px;
    margin: auto;
  }

  .eyebrow {
    margin-top: 16px;
  }

  h1 {
    font-size: clamp(32px, 8vw, 38px);
    line-height: 1.15;
    margin-top: 12px;
  }

  .intro {
    font-size: 14.5px;
    margin-bottom: 24px;
  }

  .tabs {
    margin-bottom: 24px;
  }

  .tab {
    font-size: 13px;
    min-height: 42px;
  }

  label {
    font-size: 13px;
    margin-top: 15px;
  }

  input {
    min-height: 48px;
    font-size: 16px; /* Evita zoom automático en iOS */
  }

  .submit {
    min-height: 50px;
    margin-top: 24px;
    font-size: 15px;
  }
}

/* TELÉFONOS PEQUEÑOS */

@media (max-width: 380px) {
  .content {
    padding: 28px 16px;
  }

  h1 {
    font-size: 30px;
  }

  .intro {
    font-size: 13.5px;
  }
}

/* MÓVILES EN HORIZONTAL */

@media (max-width: 760px) and (max-height: 560px) {
  .content {
    align-items: flex-start;
    padding-top: 24px;
    padding-bottom: 24px;
  }

  .eyebrow {
    margin-top: 8px;
  }

  h1 {
    font-size: 28px;
    margin-top: 8px;
    margin-bottom: 6px;
  }

  .intro {
    margin-bottom: 16px;
  }
}

/* ACCESIBILIDAD */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
  </style>
</head>
<body>
  <aside class="visual" aria-hidden="true">
    <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=1200&q=85" alt="">
    <div class="visual-copy">
      <div style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--grapefruit)">POMELO BRUNCH HOUSE</div>
      <h2>Una semana<br>bien <em>alimentada.</em></h2>
      <p>Comida real. Días más sencillos.</p>
    </div>
  </aside>

  <main class="content">
    <div class="panel">
      <a class="brand" href="./">pomelo<span>.</span><small>brunch house</small></a>

      <div class="eyebrow">Tu espacio personal</div>
      <h1 id="heading">Qué gusto verte.</h1>
      <p class="intro" id="intro">Entra a tu cuenta para organizar tus comidas de la semana.</p>

      <div class="tabs" role="tablist">
        <button class="tab active" id="loginTab" type="button" role="tab">Iniciar sesión</button>
        <button class="tab" id="signupTab" type="button" role="tab">Crear cuenta</button>
      </div>

      <form id="authForm">
        <div id="nameField" class="hidden">
          <label for="fullName">Nombre completo</label>
          <input id="fullName" name="fullName" autocomplete="name" maxlength="100">
        </div>

        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">

        <div id="phoneField" class="hidden">
          <label for="phone">Teléfono</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="25">
        </div>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>

        <button class="submit" id="submitButton" type="submit">Entrar a mi cuenta ↗</button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>
      <button id="resetButton" class="back" type="button" style="border:0;background:none;padding:0;cursor:pointer">Olvidé mi contraseña</button>
      <br>
      <a class="back" href="./">← Volver a Pomelo</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://nwjqtwhtnkknfbgzptpx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_NullE2x0L-W14H3boJBIHNKQ_llE6Es63".replace("Null", "Nu");

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const form = document.getElementById("authForm");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    let mode = "login";

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + (type || "");
    }

    function setMode(nextMode) {
      mode = nextMode;
      const signup = mode === "signup";
      loginTab.classList.toggle("active", !signup);
      signupTab.classList.toggle("active", signup);
      document.getElementById("nameField").classList.toggle("hidden", !signup);
      document.getElementById("phoneField").classList.toggle("hidden", !signup);
      document.getElementById("fullName").required = signup;
      document.getElementById("heading").textContent = signup ? "Empecemos por aquí." : "Qué gusto verte.";
      document.getElementById("intro").textContent = signup
        ? "Crea tu cuenta para organizar tus comidas."
        : "Entra a tu cuenta para organizar tus comidas de la semana.";
      document.getElementById("password").autocomplete = signup ? "new-password" : "current-password";
      submitButton.textContent = signup ? "Crear mi cuenta ↗" : "Entrar a mi cuenta ↗";
      document.getElementById("resetButton").classList.toggle("hidden", signup);
      showMessage("", "");
    }

    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("", "");
      submitButton.disabled = true;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        if (mode === "signup") {
          const fullName = document.getElementById("fullName").value.trim();
          const phone = document.getElementById("phone").value.trim();

          const { data, error } = await db.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: window.location.origin + window.location.pathname,
              data: { full_name: fullName, phone: phone }
            }
          });
          if (error) throw error;

          if (data.user) {
            const { error: metadataError } = await db.auth.updateUser({
              data: {
                full_name: fullName,
                phone: phone
              }
            });

            if (metadataError && data.session) {
              throw metadataError;
            }

            if (data.session) {
              const { error: profileError } = await db
                .from("profiles")
                .upsert({
                  id: data.user.id,
                  full_name: fullName,
                  phone: phone,
                  role: "customer"
                });

              if (profileError) throw profileError;
            }
          }

          showMessage(
            data.session
              ? "¡Cuenta creada! Ya puedes continuar."
              : "Cuenta registrada. Revisa tu correo para confirmar la dirección antes de iniciar sesión.",
            "success"
          );
          if (data.session) form.reset();
        } else {
          const { data, error } = await db.auth.signInWithPassword({ email, password });
          if (error) throw error;

          const { data: profile, error: profileError } = await db
            .from("profiles")
            .select("role")
            .eq("id", data.user.id)
            .maybeSingle();

          if (profileError) throw profileError;

          if (!profile) {
            const fullName = data.user.user_metadata?.full_name || "";
            const phone = data.user.user_metadata?.phone || "";
            const { error: insertError } = await db.from("profiles").insert({
              id: data.user.id,
              full_name: fullName,
              phone: phone,
              role: "customer"
            });
            if (insertError) throw insertError;
          }

          if (profile?.role === "chef") {
            showMessage("Sesión iniciada. Abriendo administrador...", "success");
            window.location.href = "./admin.html";
          } else {
            showMessage("Sesión iniciada correctamente.", "success");
            window.location.href = "./menu.html";
          }

        }
      } catch (error) {
        showMessage(error.message || "No se pudo completar la operación. Inténtalo de nuevo.", "error");
      } finally {
        submitButton.disabled = false;
      }
    });

    document.getElementById("resetButton").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) {
        showMessage("Escribe tu correo para enviarte el enlace de recuperación.", "error");
        document.getElementById("email").focus();
        return;
      }

      try {
        const { error } = await db.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + window.location.pathname
        });
        if (error) throw error;
        showMessage("Si el correo está registrado, recibirás instrucciones para recuperar tu contraseña.", "success");
      } catch (error) {
        showMessage(error.message || "No se pudo enviar el enlace.", "error");
      }
    });
  </script>
</body>
</html>
