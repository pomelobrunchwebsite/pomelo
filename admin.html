<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6ef">
  <title>Administración | Pomelo Brunch House</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500..700;1,500..700&display=swap" rel="stylesheet">
  <style>

:root {
  --cream: #f8f6ef;
  --green: #536247;
  --green-hover: #435039;
  --dark: #25291f;
  --muted: #6b6d61;
  --line: #e5e2d8;
  --white: #fffefa;
  --sand: #e9e4d7;
  --grapefruit: #e88772;
  --grapefruit-hover: #d5745f;
  --grapefruit-soft: #f8e7e1;
  --danger: #a33b32;
  --pad: clamp(16px, 4vw, 36px);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 96px;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--dark);
  font-family: "Inter", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

:focus-visible {
  outline: 2px solid var(--grapefruit);
  outline-offset: 3px;
}

/* ENCABEZADO */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  min-height: 76px;
  padding: 0 var(--pad);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  background: rgba(248, 246, 239, .92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  transition: box-shadow .3s ease;
}

.brand {
  display: inline-block;
  flex-shrink: 0;
  font-family: "Manrope", system-ui, sans-serif;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.8px;
  line-height: 1.1;
  color: var(--dark);
  transition: transform .2s ease;
}

.brand:hover {
  transform: scale(1.02);
}

.brand span {
  color: var(--grapefruit);
}

.header-right {
  display: flex;
  gap: 14px;
  align-items: center;
}

.muted {
  color: var(--muted);
  font-size: 13.5px;
}

/* CONTENIDO */

main {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: clamp(30px, 6vw, 60px) var(--pad) 80px;
}

h1 {
  font-family: "Manrope", system-ui, sans-serif;
  font-size: clamp(30px, 4vw, 44px);
  font-weight: 800;
  line-height: 1.15;
  margin: 0 0 10px;
  letter-spacing: -1.2px;
}

h2 {
  font-family: "Manrope", system-ui, sans-serif;
  font-size: clamp(20px, 2.5vw, 26px);
  font-weight: 700;
  line-height: 1.25;
  margin: 0 0 18px;
  letter-spacing: -0.5px;
}

p {
  line-height: 1.7;
  margin-top: 0;
}

/* BOTONES */

button,
.btn,
.tab {
  min-height: 44px;
}

.btn,
.tab {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 18px;
  background: var(--white);
  color: var(--dark);
  font-family: "Inter", system-ui, sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn:hover,
.tab:hover {
  border-color: var(--grapefruit);
  color: var(--grapefruit);
  background: var(--cream);
}

.btn.primary,
.tab.active {
  background: var(--green);
  border-color: var(--green);
  color: white;
  box-shadow: 0 4px 14px rgba(83, 98, 71, 0.2);
}

.btn.primary:hover {
  background: var(--green-hover);
  color: white;
  transform: translateY(-1px);
}

.btn.danger {
  color: var(--danger);
  border-color: #f0d5d2;
  background: #fdf2f1;
}

.btn.danger:hover {
  background: #f9e2e0;
  color: #a33b32;
  border-color: #a33b32;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

/* INTRODUCCIÓN */

.topline {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 28px;
}

.topline p {
  margin: 0;
  color: var(--muted);
  font-size: 15px;
}

#refresh-btn {
  flex-shrink: 0;
}

/* ESTADÍSTICAS */

.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat,
.panel {
  min-width: 0;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 10px 30px rgba(37, 41, 31, 0.02);
}

.stat .muted {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.stat .number {
  font-family: "Manrope", system-ui, sans-serif;
  font-size: clamp(28px, 3.5vw, 38px);
  font-weight: 800;
  line-height: 1.1;
  margin-top: 10px;
  color: var(--green);
  overflow-wrap: anywhere;
}

/* PESTAÑAS */

.tabs {
  display: flex;
  gap: 8px;
  margin: 24px 0 28px;
  padding-bottom: 4px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}

.tab {
  flex: 0 0 auto;
  white-space: nowrap;
  font-size: 14px;
  border-radius: 50px;
}

/* ENCABEZADOS DE SECCIÓN */

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.section-head h2 {
  margin: 0;
}

/* FORMULARIOS */

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.field {
  min-width: 0;
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  margin-bottom: 8px;
}

input,
select,
textarea {
  display: block;
  width: 100%;
  min-width: 0;
  min-height: 50px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--cream);
  color: var(--dark);
  font-family: "Inter", system-ui, sans-serif;
  font-size: 15px;
  transition: all 0.2s ease;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--grapefruit);
  outline: none;
  background: var(--white);
  box-shadow: 0 0 0 3px var(--grapefruit-soft);
}

input[type="checkbox"] {
  width: 20px;
  height: 20px;
  min-height: 20px;
  padding: 0;
  accent-color: var(--green);
  flex: 0 0 auto;
}

input[type="file"] {
  padding: 10px;
  font-size: 13.5px;
  background: var(--white);
}

textarea {
  min-height: 110px;
  resize: vertical;
}

.full {
  grid-column: 1 / -1;
}

.checkline {
  display: flex;
  gap: 12px;
  align-items: center;
  margin: 12px 0 22px;
  padding: 12px 16px;
  background: var(--cream);
  border-radius: 12px;
  border: 1px solid var(--line);
}

.checkline label {
  margin: 0;
}

#item-form {
  margin-bottom: 28px;
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--white);
  box-shadow: 0 12px 35px rgba(37,41,31,0.03);
}

#item-form h2 {
  margin-bottom: 22px;
}

#item-form button {
  margin: 6px 8px 0 0;
}

/* DÍAS DISPONIBLES */

.days-selector {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.day-option {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 0;
  min-height: 48px;
  padding: 8px;
  margin: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--cream);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s ease;
}

.day-option:hover {
  border-color: var(--grapefruit);
}

.day-option input {
  width: 16px;
  height: 16px;
  min-height: 16px;
  margin: 0;
}

/* FILTROS DEL MENÚ */

.menu-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin: 22px 0 18px;
}

.menu-filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.menu-filter {
  min-height: 42px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: 50px;
  background: var(--white);
  color: var(--dark);
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
}

.menu-filter.active {
  background: var(--grapefruit);
  border-color: var(--grapefruit);
  color: white;
}

/* LISTAS Y PLATILLOS */

.list {
  display: grid;
  gap: 14px;
}

.item {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  background: var(--white);
  transition: box-shadow 0.2s ease;
}

.item:hover {
  box-shadow: 0 8px 25px rgba(37,41,31,0.04);
}

.item > div:first-child {
  min-width: 0;
  flex: 1 1 auto;
}

.item-title {
  font-family: "Manrope", system-ui, sans-serif;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 6px;
  overflow-wrap: anywhere;
}

.item p {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.item-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  flex: 0 0 auto;
}

.pill {
  font-size: 12px;
  font-weight: 600;
  border-radius: 30px;
  background: var(--cream);
  border: 1px solid var(--line);
  padding: 4px 12px;
  display: inline-block;
  line-height: 1.4;
  color: var(--muted);
}

.pill.pill-success {
  background: #e8f3e9;
  color: #397a45;
  border-color: #c8e6c9;
}

.pill.pill-warning {
  background: #fbf2dc;
  color: #946b20;
  border-color: #f7e2b3;
}

.pill.pill-danger {
  background: #f9e9e7;
  color: #a33b32;
  border-color: #f2cac6;
}

/* AVISOS */

.notice {
  padding: 16px 20px;
  border-radius: 14px;
  margin: 18px 0;
  background: var(--cream);
  border: 1px solid var(--line);
  font-size: 14.5px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.notice.error {
  color: #a33b32;
  background: #fdf2f1;
  border-color: #f0d5d2;
}

.notice.success {
  color: var(--green);
  background: #edf3eb;
  border-color: #d4e3d0;
}

.hidden {
  display: none !important;
}

.empty {
  color: var(--muted);
  padding: 30px 0;
  text-align: center;
  font-size: 15px;
  overflow-wrap: anywhere;
}

/* TABLAS DE PEDIDOS Y PRODUCCIÓN */

.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 16px;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 620px;
  background: var(--white);
}

th,
td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
  font-size: 14px;
}

th {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: var(--cream);
  white-space: nowrap;
}

tbody tr:last-child td {
  border-bottom: 0;
}

/* SUSCRIPCIONES Y SUSCRIPTORES */

#subscriptions-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#subscriptions-list > .sub-customer-card {
  display: flex !important;
  flex-direction: column !important;
  align-items: stretch !important;
  gap: 12px;
  padding: 18px !important;
  border-radius: 18px;
}

.sub-customer-toggle {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 10px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--white);
  color: var(--dark);
  text-align: left;
  transition: all 0.2s ease;
}

.sub-customer-toggle:hover {
  border-color: var(--grapefruit);
}

.sub-customer-name {
  flex: 1;
  min-width: 0;
  font-family: "Manrope", system-ui, sans-serif;
  font-size: 16px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.sub-customer-arrow {
  color: var(--grapefruit);
  font-size: 20px;
  flex-shrink: 0;
  font-weight: 800;
}

.sub-customer-detail {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  padding: 14px 4px 4px;
}

.sub-customer-detail.hidden {
  display: none !important;
}

.subscriber-filters {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 0 16px;
  margin-bottom: 10px;
}

.subscriber-filter {
  flex-shrink: 0;
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-radius: 50px;
  background: var(--white);
  color: var(--dark);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.subscriber-filter:hover {
  border-color: var(--grapefruit);
  color: var(--grapefruit);
}

.subscriber-filter.active {
  background: var(--grapefruit);
  color: white;
  border-color: var(--grapefruit);
}

.sub-main {
  padding: 18px;
  border-radius: 14px;
  background: var(--cream);
  border: 1px solid var(--line);
}

.sub-record-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 13.5px;
}

.sub-record-info > p {
  margin: 10px 0 !important;
}

.sub-history {
  border-top: 1px solid var(--line);
  padding-top: 14px;
}

.sub-history-toggle {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 13px;
  padding: 12px 16px;
}

.sub-history-content {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 10px;
}

.sub-history-entry {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--white);
}

/* FINANZAS */

.finance-toolbar {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(200px, 1fr);
  gap: 16px;
  margin: 22px 0;
}

.finance-account {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: 0 8px 25px rgba(37,41,31,0.02);
}

.finance-account-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
}

.finance-account-name {
  font-family: "Manrope", system-ui, sans-serif;
  font-weight: 800;
  font-size: 17px;
}

.finance-account-meta {
  color: var(--muted);
  font-size: 13.5px;
  margin-top: 4px;
}

.finance-account-bottom {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.finance-balance {
  font-size: 22px;
  font-weight: 800;
  color: var(--green);
}

.finance-pill {
  display: inline-block;
  border-radius: 30px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 700;
  background: var(--cream);
  border: 1px solid var(--line);
}

.finance-pill.pending { background: #fbf2dc; color: #946b20; border-color: #f7e2b3; }
.finance-pill.partial { background: #e8eff8; color: #365d8a; border-color: #
