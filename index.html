<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6ef">
  <meta name="description" content="Pomelo Brunch House | Comida real, ingredientes frescos y platillos preparados con intención para acompañar tu semana de lunes a viernes.">
  <title>Pomelo Brunch House | Tu semana, bien alimentada</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500..700;1,500..700&display=swap" rel="stylesheet">

  <style>
:root {
  --cream: #f8f6ef;
  --green: #536247;
  --green-hover: #435039;
  --dark: #25291f;
  --muted: #6b6d61;
  --line: #e5e2d8;
  --white: #fffefa;
  --sand: #e9e4d7;
  --grapefruit: #e88772;
  --grapefruit-hover: #d5745f;
  --grapefruit-soft: #f8e7e1;
  --pad: clamp(16px, 5vw, 76px);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 96px;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--dark);
  font-family: "Inter", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

a {
  color: inherit;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}

h1, h2, h3, h4 {
  font-family: "Manrope", system-ui, sans-serif;
  margin-top: 0;
}

p {
  margin-top: 0;
}

img {
  display: block;
  max-width: 100%;
}

button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

button, a {
  -webkit-touch-callout: none;
}

:focus-visible {
  outline: 2px solid var(--grapefruit);
  outline-offset: 3px;
}

/* AVISO SUPERIOR */
.announcement {
  padding: 10px 14px;
  background: var(--dark);
  color: var(--white);
  text-align: center;
  font-family: "Inter", sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  line-height: 1.5;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

/* ENCABEZADO */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  min-height: 76px;
  padding: 0 var(--pad);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  background: rgba(248, 246, 239, .92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  transition: box-shadow .3s ease;
}

.brand {
  display: inline-block;
  flex-shrink: 0;
  font-family: "Manrope", system-ui, sans-serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.8px;
  line-height: 1.1;
  transition: transform .2s ease;
}

.brand:hover {
  transform: scale(1.02);
}

.brand span {
  color: var(--grapefruit);
}

.brand small {
  display: block;
  margin-top: 2px;
  font-family: "Inter", system-ui, sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2.8px;
  text-transform: uppercase;
  color: var(--muted);
}

.nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: clamp(12px, 2vw, 30px);
  min-width: 0;
  font-family: "Inter", system-ui, sans-serif;
  font-size: 13.5px;
  font-weight: 500;
}

.nav a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  white-space: nowrap;
  transition: color .2s ease;
}

.nav a:hover {
  color: var(--grapefruit);
}

.nav .nav-button {
  padding: 0 20px;
  background: var(--grapefruit);
  color: white;
  border-radius: 50px;
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(232, 135, 114, 0.25);
  transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
}

.nav .nav-button:hover {
  background: var(--grapefruit-hover);
  color: white;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(232, 135, 114, 0.35);
}

/* PORTADA */
.hero {
  max-width: 1600px;
  margin: auto;
  padding: clamp(40px, 7vw, 90px) var(--pad) clamp(50px, 8vw, 90px);
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  align-items: center;
  gap: 6%;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--grapefruit);
  font-family: "Manrope", system-ui, sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.eyebrow::before {
  content: "";
  width: 28px;
  height: 2px;
  flex-shrink: 0;
  background: var(--grapefruit);
  border-radius: 2px;
}

h1 {
  margin: 20px 0;
  font-family: "Manrope", system-ui, sans-serif;
  font-size: clamp(42px, 5.5vw, 78px);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -1.8px;
}

h1 em {
  color: var(--green);
  font-style: italic;
  font-family: "Playfair Display", serif;
  font-weight: 500;
}

.hero-copy {
  max-width: 480px;
  margin-bottom: 0;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.75;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px 24px;
  margin-top: 32px;
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 52px;
  padding: 0 28px;
  border: 0;
  border-radius: 50px;
  background: var(--green);
  color: white;
  font-family: "Inter", system-ui, sans-serif;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(83, 98, 71, 0.22);
  transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
}

.button:hover {
  background: var(--green-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(83, 98, 71, 0.3);
}

.button:active {
  transform: scale(0.98);
}

.text-link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font-size: 15px;
  font-weight: 600;
  color: var(--dark);
  border-bottom: 2px solid var(--grapefruit);
  transition: color .2s ease;
}

.text-link:hover {
  color: var(--grapefruit);
}

.hero-image {
  position: relative;
  width: 100%;
  aspect-ratio: 5 / 4.2;
  overflow: hidden;
  background: var(--sand);
  border-radius: 24px;
  box-shadow: 0 20px 50px rgba(37, 41, 31, 0.1);
}

.hero-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .6s cubic-bezier(0.16, 1, 0.3, 1);
}

.hero-image:hover img {
  transform: scale(1.03);
}

.image-label {
  position: absolute;
  bottom: 18px;
  left: 18px;
  max-width: calc(100% - 36px);
  padding: 10px 16px;
  background: rgba(255, 254, 250, 0.92);
  backdrop-filter: blur(8px);
  font-size: 13px;
  font-weight: 600;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.06);
}

/* BENEFICIOS / VALORES */
.values {
  padding: 24px var(--pad);
  border-block: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 12px 20px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 600;
  background: rgba(255,254,250,0.5);
}

.values span::before {
  content: "✦";
  color: var(--grapefruit);
  margin-right: 8px;
}

/* SECCIONES */
.section {
  max-width: 1600px;
  margin: auto;
  padding: clamp(60px, 9vw, 100px) var(--pad);
}

.section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 40px;
}

h2 {
  margin: 14px 0 0;
  font-family: "Manrope", system-ui, sans-serif;
  font-size: clamp(32px, 4.2vw, 50px);
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -1.2px;
}

.section-description {
  max-width: 440px;
  margin: 0;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.75;
}

/* TARJETAS DEL CONCEPTO */
.features {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}

.feature {
  min-width: 0;
  padding: 32px;
  border: 1px solid var(--line);
  background: rgba(255, 254, 250, .7);
  border-radius: 20px;
  transition: transform .25s ease, box-shadow .25s ease;
}

.feature:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(37, 41, 31, 0.04);
}

.feature-number {
  color: var(--grapefruit);
  font-family: "Inter", system-ui, sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.feature h3 {
  margin: 20px 0 10px;
  font-family: "Manrope", system-ui, sans-serif;
  font-size: 24px;
  font-weight: 700;
}

.feature p {
  margin: 0;
  color: var(--muted);
  font-size: 14.5px;
  line-height: 1.75;
}

/* CÓMO FUNCIONA */
.how {
  background: #e9ebdf;
  border-block: 1px solid var(--line);
}

.how-inner {
  max-width: 1600px;
  margin: auto;
  padding: clamp(60px, 9vw, 100px) var(--pad);
}

.steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
  margin-top: 40px;
}

.step {
  min-width: 0;
  padding: 30px;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(37, 41, 31, 0.03);
  transition: transform .25s ease;
}

.step:hover {
  transform: translateY(-3px);
}

.step strong {
  color: var(--grapefruit);
  font-family: "Inter", system-ui, sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  display: block;
}

.step h3 {
  margin: 14px 0 10px;
  font-family: "Manrope", system-ui, sans-serif;
  font-size: 22px;
  font-weight: 700;
  line-height: 1.3;
}

.step p {
  margin: 0;
  color: #5a5f52;
  font-size: 14.5px;
  line-height: 1.75;
}

/* LLAMADO FINAL */
.closing {
  padding: clamp(60px, 9vw, 100px) var(--pad);
  text-align: center;
}

.closing h2 {
  max-width: 680px;
  margin: 16px auto;
}

.closing p {
  max-width: 520px;
  margin: 0 auto 30px;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.8;
}

/* PIE DE PÁGINA */
footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px 24px;
  padding: 36px var(--pad) calc(36px + env(safe-area-inset-bottom));
  color: var(--muted);
  font-size: 13.5px;
  border-top: 1px solid var(--line);
  background: var(--white);
}

/* ANIMACIONES DE SCROLL (SCROLL REVEAL) */
.reveal {
  opacity: 0;
